<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Active Learning 리뷰 큐 | AI Hawk-Eye Lite 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 상단 네비게이션 -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-3">
        <a href="/" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-xl font-black text-white flex items-center gap-2">
            🏸 Active Learning 리뷰 큐
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30">Admin</span>
          </h1>
          <p class="text-xs text-slate-400">동호인 불복(Disputed) 오심 의심 케이스 격리 보관소</p>
        </div>
      </div>
      <button id="btn-refresh" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 hover:bg-slate-800 text-xs font-semibold transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 새로고침
      </button>
    </div>

    <!-- 요약 통계 배너 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <span class="text-xs text-slate-400 block font-medium">격리된 오심 케이스</span>
        <span id="stat-count" class="text-2xl font-black text-rose-400 mt-1 block">0건</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <span class="text-xs text-slate-400 block font-medium">데이터셋 격리 디렉토리</span>
        <span class="text-xs font-mono text-emerald-400 mt-1 block truncate">dataset/hard-negatives/</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <span class="text-xs text-slate-400 block font-medium">다음 파인튜닝 타깃</span>
        <span class="text-xs font-semibold text-cyan-400 mt-1 block">YOLOv8 착지 접촉 경계선 가중치</span>
      </div>
    </div>

    <!-- 오심 의심 케이스 리스트 -->
    <div class="space-y-4">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400"></i> 검토 대기 케이스 목록
      </h2>

      <div id="cases-container" class="space-y-3">
        <p class="text-center text-slate-500 py-8 text-sm">로딩 중...</p>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadDisputedCases();
      document.getElementById('btn-refresh').addEventListener('click', loadDisputedCases);
    });

    async function loadDisputedCases() {
      const container = document.getElementById('cases-container');
      const statCount = document.getElementById('stat-count');

      try {
        const res = await fetch('/api/feedback/review-queue');
        const json = await res.json();
        const items = json.data || [];

        statCount.textContent = `${items.length}건`;

        if (items.length === 0) {
          container.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center">
              <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500 mx-auto mb-2"></i>
              <p class="text-sm font-semibold text-slate-200">현재 불복 제기된 오심 케이스가 없습니다.</p>
              <p class="text-xs text-slate-500 mt-1">사용자가 모바일에서 [판정이 틀려요]를 선택하면 이곳에 자동 격리됩니다.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        container.innerHTML = items.map((item) => {
          const fb = item.feedback || {};
          const timeStr = new Date(item.created_at).toLocaleString('ko-KR');

          return `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                    ID: ${item.id.slice(0, 8)}
                  </span>
                  <span class="text-xs text-slate-400">${timeStr}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-slate-400">시스템 판정:</span>
                  <span class="text-xs font-black px-2 py-0.5 rounded ${item.final_decision === 'IN' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">
                    ${item.final_decision} (오차 ${item.distance_cm}cm)
                  </span>
                  <span class="text-xs font-semibold text-slate-400">➡️ 사용자 의견:</span>
                  <span class="text-xs font-black px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">
                    ${fb.user_decision || '미지정'}
                  </span>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 스냅샷 이미지 -->
                <div class="bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-slate-800">
                  <img src="${item.snapshot_url}" alt="스냅샷" class="w-full h-full object-contain" />
                </div>

                <!-- 상세 코멘트 & 아카이브 경로 -->
                <div class="md:col-span-2 space-y-2.5 text-xs">
                  <div>
                    <span class="font-bold text-slate-400 block mb-0.5">💬 동호인 사용자 불복 사유:</span>
                    <p class="p-2.5 rounded-lg bg-slate-950/80 border border-slate-800 text-slate-200">
                      "${fb.comment || '별도 사유 미작성'}"
                    </p>
                  </div>

                  <div>
                    <span class="font-bold text-slate-400 block mb-0.5">📁 격리 보관 경로:</span>
                    <p class="font-mono text-[11px] text-cyan-400 truncate bg-slate-950 p-2 rounded border border-slate-800">
                      dataset/hard-negatives/${item.id}/
                    </p>
                  </div>

                  <div class="flex items-center gap-2 pt-1 text-slate-500 text-[11px]">
                    <span>비디오: ${item.video_filename}</span>
                    <span>·</span>
                    <span>착지 프레임: #${item.impact_frame_idx}</span>
                    <span>·</span>
                    <span>신뢰도: ${Math.round(item.confidence * 100)}%</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        lucide.createIcons();
      } catch (err) {
        container.innerHTML = `<p class="text-rose-400 text-center py-4">데이터 로드 실패: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
